name: Keep Render warm

# Free Render sleeps after idle; frequent pings cut cold-start wait.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Warm critical paths
        run: |
          set +e
          BASE="https://bai-rwtf.onrender.com"
          echo "Waking $BASE"
          for i in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 45 "$BASE/up" || echo 000)
            echo "up attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              # Hit heavy pages so file/view caches stay warm.
              for path in "/" "/c/instant-solutions/quick-test" "/journeys" "/search?q=prompt"; do
                curl -sS -o /dev/null -w "$path -> %{http_code} %{time_starttransfer}s\n" --max-time 45 "$BASE$path" || true
              done
              exit 0
            fi
            sleep 4
          done
          echo "Still waking after retries"
          exit 0
