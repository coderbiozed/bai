name: Keep Render warm

# Free Render sleeps after idle; this ping reduces the long "Application loading" screen.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake bAI (/up then /)
        run: |
          set +e
          UP="https://bai-rwtf.onrender.com/up"
          HOME="https://bai-rwtf.onrender.com/"
          echo "Waking $UP"
          # Cold starts can take 1–2 minutes; keep trying.
          for i in $(seq 1 24); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 45 "$UP" || echo 000)
            echo "up attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              curl -sS -o /dev/null -w "home -> %{http_code}\n" --max-time 45 "$HOME" || true
              exit 0
            fi
            sleep 5
          done
          echo "Still waking after retries (Render may be overloaded)"
          exit 0
