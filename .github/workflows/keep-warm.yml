name: Keep Render warm

# Prevents free-tier spin-down (cold starts that feel like endless loading).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping bAI health endpoint
        run: |
          set -e
          URL="https://bai-rwtf.onrender.com/up"
          echo "Pinging $URL"
          for i in 1 2 3; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 90 "$URL" || echo 000)
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Health check did not return 200 (service may still be waking)"
          exit 0
