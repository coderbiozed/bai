<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bAI</title>
  <meta name="description" content="bAI — Learn AI Language">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 46, 189, 0.35), transparent 40%),
        radial-gradient(circle at 80% 30%, rgba(45, 226, 230, 0.3), transparent 35%),
        linear-gradient(160deg, #100818, #1a1040 45%, #062028);
      color: #f4f0ff;
      padding: 1.5rem;
    }
    .card {
      width: min(28rem, 100%);
      border: 2px solid rgba(200, 245, 66, 0.45);
      background: rgba(16, 8, 24, 0.72);
      border-radius: 1.5rem;
      padding: 2rem;
      text-align: center;
    }
    .brand {
      font-size: clamp(3rem, 12vw, 4.5rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      color: #c8f542;
      line-height: 1;
      margin: 0;
    }
    .tag {
      margin: 0.75rem 0 0;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #2de2e6;
    }
    .status {
      margin: 1.5rem 0 0;
      color: rgba(244, 240, 255, 0.78);
      line-height: 1.45;
      min-height: 3.2rem;
    }
    .bar {
      margin: 1.25rem auto 0;
      width: 100%;
      height: 0.55rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      overflow: hidden;
    }
    .bar > span {
      display: block;
      height: 100%;
      width: 35%;
      border-radius: inherit;
      background: linear-gradient(90deg, #ff2ebd, #c8f542, #2de2e6);
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(320%); }
    }
    a {
      color: #c8f542;
      font-weight: 700;
    }
    .ready .bar { display: none; }
  </style>
</head>
<body>
  <main class="card" id="card">
    <p class="brand">bAI</p>
    <p class="tag">Learn AI Language</p>
    <p class="status" id="status">Waking the app… usually a few seconds.</p>
    <div class="bar" aria-hidden="true"><span></span></div>
    <p class="status" style="margin-top:1rem;font-size:0.9rem">
      Or open <a id="direct" href="https://bai-rwtf.onrender.com/">bai-rwtf.onrender.com</a>
    </p>
  </main>
  <script>
    const APP = "https://bai-rwtf.onrender.com";
    const status = document.getElementById("status");
    const card = document.getElementById("card");
    document.getElementById("direct").href = APP + "/";

    let tries = 0;
    async function wake() {
      tries += 1;
      try {
        const res = await fetch(APP + "/up", { mode: "cors", cache: "no-store" });
        if (res.ok) {
          card.classList.add("ready");
          status.textContent = "Ready — opening bAI…";
          location.replace(APP + "/");
          return;
        }
      } catch (_) {
        // Cold start / CORS / network — keep polling
      }
      if (tries === 1) status.textContent = "Server is starting (free host sleep). Hang tight…";
      if (tries === 4) status.textContent = "Still waking… first visit after idle can take ~30–60s.";
      if (tries >= 20) {
        status.innerHTML = 'Taking longer than usual. <a href="' + APP + '/">Open bAI anyway</a>';
        return;
      }
      setTimeout(wake, 2000);
    }
    wake();
  </script>
</body>
</html>
