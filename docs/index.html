<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bAI — opening…</title>
  <meta name="description" content="bAI — Learn AI Language. Fast entry while the app wakes.">
  <meta name="theme-color" content="#100818">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(circle at 18% 18%, rgba(255, 46, 189, 0.35), transparent 42%),
        radial-gradient(circle at 82% 28%, rgba(45, 226, 230, 0.28), transparent 38%),
        linear-gradient(160deg, #100818, #1a1040 48%, #062028);
      color: #f4f0ff;
      padding: 1.5rem;
    }
    .card {
      width: min(30rem, 100%);
      border: 2px solid rgba(200, 245, 66, 0.5);
      background: rgba(16, 8, 24, 0.78);
      border-radius: 1.5rem;
      padding: 2rem 1.75rem;
      text-align: center;
    }
    .brand {
      margin: 0;
      font-size: clamp(3.2rem, 14vw, 4.8rem);
      font-weight: 800;
      letter-spacing: -0.05em;
      color: #c8f542;
      line-height: 0.95;
    }
    .tag {
      margin: 0.7rem 0 0;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #2de2e6;
    }
    .status {
      margin: 1.4rem 0 0;
      color: rgba(244, 240, 255, 0.82);
      line-height: 1.5;
      min-height: 3.4rem;
    }
    .bar {
      margin: 1.2rem auto 0;
      width: 100%;
      height: 0.55rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      overflow: hidden;
    }
    .bar > i {
      display: block;
      height: 100%;
      width: 38%;
      border-radius: inherit;
      background: linear-gradient(90deg, #ff2ebd, #c8f542, #2de2e6);
      animation: slide 1.05s ease-in-out infinite;
    }
    @keyframes slide {
      0% { transform: translateX(-130%); }
      100% { transform: translateX(320%); }
    }
    a { color: #c8f542; font-weight: 700; }
    .ready .bar { display: none; }
    .hint { margin-top: 1rem; font-size: 0.85rem; color: rgba(244, 240, 255, 0.55); }
  </style>
</head>
<body>
  <main class="card" id="card">
    <p class="brand">bAI</p>
    <p class="tag">Learn AI Language</p>
    <p class="status" id="status">Opening bAI… waking the server if it was asleep.</p>
    <div class="bar" aria-hidden="true"><i></i></div>
    <p class="hint">Free hosts sleep when idle. This page wakes it, then opens the app.</p>
    <p class="hint">Direct link: <a id="direct" href="https://bai-rwtf.onrender.com/">bai-rwtf.onrender.com</a></p>
  </main>
  <script>
    const APP = "https://bai-rwtf.onrender.com";
    const statusEl = document.getElementById("status");
    const card = document.getElementById("card");
    document.getElementById("direct").href = APP + "/";

    let tries = 0;
    const started = Date.now();

    async function wake() {
      tries += 1;
      const secs = Math.round((Date.now() - started) / 1000);
      try {
        const res = await fetch(APP + "/up", { mode: "cors", cache: "no-store" });
        if (res.ok) {
          card.classList.add("ready");
          statusEl.textContent = "Ready — opening bAI…";
          location.replace(APP + "/");
          return;
        }
      } catch (_) {}

      if (tries === 1) statusEl.textContent = "Server is starting… usually under a minute.";
      else if (secs < 45) statusEl.textContent = "Still waking… (" + secs + "s)";
      else if (secs < 90) statusEl.textContent = "Almost there… first visit after sleep can take ~60s.";
      else {
        statusEl.innerHTML = 'Taking longer than usual. <a href="' + APP + '/">Open bAI now</a>';
        if (tries > 40) return;
      }
      setTimeout(wake, 1500);
    }
    wake();
  </script>
</body>
</html>
