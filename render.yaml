services:
  - type: web
    name: bai
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      # Never use generateValue for APP_KEY — it breaks Laravel encryption (500).
      # start.sh installs a valid base64 32-byte key on boot when missing/invalid.
      - key: APP_NAME
        value: bAI
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /app/database/database.sqlite
