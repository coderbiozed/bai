services:
  - type: web
    name: bai
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      # Must be a real Laravel key (base64 + 32 bytes). Never use generateValue.
      - key: APP_KEY
        value: base64:eOmCqltp/cpmpEdwAkynEMoP8OC9/PKrU7d8UPkvkxY=
      - key: APP_NAME
        value: bAI
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /app/database/database.sqlite
